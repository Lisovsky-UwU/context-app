# Пример для внешнего nginx, который держит TLS и проксирует на контейнер.
# Положите рядом со своими сайтами, подставьте домен и пути к сертификатам.

server {
    listen 80;
    server_name context.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name context.example.com;

    ssl_certificate     /etc/letsencrypt/live/context.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/context.example.com/privkey.pem;

    # Фотографии могут быть тяжёлыми: лимит должен быть не меньше, чем MAX_UPLOAD_MB.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
