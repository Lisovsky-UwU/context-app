# Только база для локальной разработки: docker compose -f deploy/dev-db.yml up -d
name: context-app-dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: context
      POSTGRES_PASSWORD: context
      POSTGRES_DB: context
    ports:
      - "5433:5432"
    volumes:
      - dev_db_data:/var/lib/postgresql/data

volumes:
  dev_db_data:
